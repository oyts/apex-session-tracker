name: Windows tests
on: [push, pull_request]
jobs:
  isolated:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
        env:
          RUN_OCR_TESTS: '1'
